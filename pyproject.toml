[project]
name = "discord-winhook"
version = "0.2.0"
description = "A library to simplify sending information updates from Windows systems through a Discord webhook"
authors = [
    { name = "ZackaryW", email = "36378555+ZackaryW@users.noreply.github.com" }
]
dependencies = [
    "discord-webhook>=1.3.1"
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
info = [
    "psutil>=6.0.0"
]

screenshot = [
    "pygetwindow>=0.0.9",
    "pyautogui>=0.9.54",
    "pyscreeze>=1.0.1",
    "pillow>=11.1.0",
]

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/discord_winhook"]


[tool.ruff]
ignore = ["F401"]
